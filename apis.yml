aid: curse
name: Curse
description: 'Curse (Curse Inc.) built and operated CurseForge, Gamepedia, and the Curse gaming
  network; its platform assets are now operated under Fandom / Overwolf. The live developer surface
  is the CurseForge Core API — a REST API over the CurseForge catalog of game mods, modpacks, and
  add-ons, covering games, categories, mods, files, fingerprint matching, and Minecraft versions and
  mod loaders. It is authenticated with an x-api-key header issued from the CurseForge for Studios
  developer console, with third-party access granted via an approved application.'
