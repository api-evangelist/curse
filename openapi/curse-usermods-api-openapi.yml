openapi: 3.2.0
info:
  title: CurseForge Core User Mods API
  description: All endpoints use the same base URL - https://api.curseforge.com
  version: v1
servers:
- url: https://api.curseforge.com
security:
- API_KEY: []
tags:
- name: UserMods
paths:
  /v1/users/me/mods:
    get:
      tags:
      - UserMods
      description: Get the current user's owned and tester mods for the given game key
      operationId: GetUserMods
      parameters:
      - name: index
        in: query
        description: 'A zero based index of the first item to include in the response,  the limit is: (index + pageSize <= 10,000).'
        schema:
          type: integer
          format: int32
        x-position: 1
      - name: pageSize
        in: query
        description: The number of items to include in the response,  the default/maximum value is 50.
        schema:
          type: integer
          format: int32
        x-position: 2
      - name: HasExplicitPageSize
        in: query
        description: 'Whether the caller actually supplied a pageSize, as opposed to

          pageSize returning the default because none was sent. [FromQuery]

          model binding always constructs this class - even from an empty

          query string - so pageSize''s own getter can''t be used to tell those

          two cases apart from outside the class.'
        schema:
          type: boolean
        x-position: 3
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Search_Mods_Response'
        '500':
          description: ''
        '403':
          description: ''
      summary: Get user mods
      x-summary-source: derived
      x-operation-id-source: normalized
      x-operation-id-original: Get User Mods
  /v1/users/me/my-library/search:
    get:
      tags:
      - UserMods
      description: 'Search the current user''s library (purchased/created/testing/trial mods)

        for the given game key, filtered and sorted by the given search parameters'
      operationId: SearchUserLibrary
      parameters:
      - name: gameId
        in: query
        required: true
        description: Filter by game id.
        schema:
          type: integer
          format: int32
        x-position: 1
      - name: classId
        in: query
        description: Filter by section id (discoverable via Categories)
        schema:
          type: integer
          format: int32
        x-position: 2
      - name: categoryId
        in: query
        description: Filter by category id
        schema:
          type: integer
          format: int32
        x-position: 3
      - name: categoryIds
        in: query
        description: "Filter by a list of category ids - this will override categoryId\ncategoryIds=[1,2,3...]\n            \nThe maximum allowed category ids per query is 10"
        schema:
          type: string
        x-position: 4
      - name: gameVersion
        in: query
        description: Filter by game version string
        schema:
          type: string
        x-position: 5
      - name: gameVersions
        in: query
        description: "Filter by a list of game version strings - this will override\ngameVersion\n            \ngameVersions=[\"1.19.1\", \"1.19.2\", \"1.20.1\" ...]\n            \nThe maximum allowed category ids per query is 4"
        schema:
          type: string
        x-position: 6
      - name: searchFilter
        in: query
        description: Filter by free text search in the mod name and author
        schema:
          type: string
        x-position: 7
      - name: sortField
        in: query
        description: Filter by ModsSearchSortField enumeration
        schema:
          $ref: '#/components/schemas/ModsSearchSortField'
        x-position: 8
      - name: sortOrder
        in: query
        description: '''asc'' if sort is in ascending order, ''desc'' if sort is in descending order'
        schema:
          $ref: '#/components/schemas/SortOrder'
        x-position: 9
      - name: modLoaderType
        in: query
        description: Filter only mods associated to a given modloader (Forge, Fabric ...). Must be coupled with gameVersion.
        schema:
          $ref: '#/components/schemas/ModLoaderType'
        x-position: 10
      - name: modLoaderTypes
        in: query
        description: "Filter by a list of mod loader types - this will override modLoaderType\nmodLoaderTypes=[Forge, Fabric, ...]\n            \nMax values = 5"
        schema:
          type: string
        x-position: 11
      - name: gameVersionTypeId
        in: query
        description: Filter only mods that contain files tagged with versions of the given gameVersionTypeId
        schema:
          type:
          - integer
          - 'null'
          format: int32
        x-position: 12
      - name: authorId
        in: query
        description: Filter only mods that the given authorId is a member of.
        schema:
          type:
          - integer
          - 'null'
          format: int32
        x-position: 13
      - name: primaryAuthorId
        in: query
        description: Filter only mods that the given primaryAuthorId is the owner of.
        schema:
          type:
          - integer
          - 'null'
          format: int32
        x-position: 14
      - name: PremiumType
        in: query
        description: Filter only mods that are Premium or not.
        schema:
          $ref: '#/components/schemas/ModPremiumTypeEnum'
        x-position: 15
      - name: slug
        in: query
        description: Filter by slug (coupled with classId will result in a unique result).
        schema:
          type: string
        x-position: 16
      - name: clientCompatible
        in: query
        description: 'When set to true, will filter out any mod that doesn''t have a default

          file that is compatible with the client. This is usually due to a bad

          file structure of the file (which might cause unexpected behaviours on

          the user''s machine - such as overriding other mods installed).'
        schema:
          type: boolean
        x-position: 17
      - name: modsSearchEnhancedFeatures
        in: query
        description: Bitwise number with values from ModsSearchEnhancedFeatures
        schema:
          type: integer
          format: int64
        x-position: 18
      - name: sections
        in: query
        description: Comma delimited list of library sections to include (purchased, created, testing, trial). If omitted, all sections are included.
        schema:
          type: string
        x-position: 19
      - name: index
        in: query
        description: 'A zero based index of the first item to include in the response,  the limit is: (index + pageSize <= 10,000).'
        schema:
          type: integer
          format: int32
        x-position: 20
      - name: pageSize
        in: query
        description: The number of items to include in the response,  the default/maximum value is 50.
        schema:
          type: integer
          format: int32
        x-position: 21
      - name: HasExplicitPageSize
        in: query
        description: 'Whether the caller actually supplied a pageSize, as opposed to

          pageSize returning the default because none was sent. [FromQuery]

          model binding always constructs this class - even from an empty

          query string - so pageSize''s own getter can''t be used to tell those

          two cases apart from outside the class.'
        schema:
          type: boolean
        x-position: 22
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseWithPaginationOfDictionaryOfStringAndListOfMod'
        '500':
          description: ''
        '400':
          description: ''
        '403':
          description: ''
      summary: Search user library
      x-summary-source: derived
      x-operation-id-source: normalized
      x-operation-id-original: Search User Library
